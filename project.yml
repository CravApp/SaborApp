name: SaborApp
options:
  bundleIdPrefix: com.cravapp
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  SaborApp:
    type: application
    platform: iOS
    sources:
      - path: SaborApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cravapp.saborapp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: SaborApp
        CODE_SIGN_STYLE: Automatic
schemes:
  SaborApp:
    build:
      targets:
        SaborApp: all
